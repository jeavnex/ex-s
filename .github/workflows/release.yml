name: Релиз EX-S

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Подготовить постоянный ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.EXS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/exs-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/exs-signing/release.jks"
      - name: Собрать подписанный APK
        env:
          EXS_KEYSTORE: ${{ runner.temp }}/exs-signing/release.jks
          EXS_STORE_PASSWORD: ${{ secrets.EXS_STORE_PASSWORD }}
          EXS_KEY_ALIAS: ${{ secrets.EXS_KEY_ALIAS }}
          EXS_KEY_PASSWORD: ${{ secrets.EXS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Подготовить файлы релиза
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/ex-s-universal.apk
          cd out
          sha256sum ex-s-universal.apk > SHA256SUMS.txt
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" out/* --title "EX-S ${GITHUB_REF_NAME}" --generate-notes
